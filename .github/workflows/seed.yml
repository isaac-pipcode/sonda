name: Seed do banco (manual)

# Cria o esquema e carrega os dados iniciais no Postgres de produção (Neon).
# Só por disparo manual. Recusa-se a rodar se o banco já tiver cruzamentos:
# o seed cria receitas novas a cada execução, e a série deve continuar única.
on:
  workflow_dispatch: {}

concurrency:
  group: seed-banco
  cancel-in-progress: false

jobs:
  seed:
    name: esquema + dados iniciais
    runs-on: ubuntu-latest
    env:
      SONDA_DATABASE_URL: ${{ secrets.SONDA_DATABASE_URL }}
      SONDA_FSA_URL: ${{ vars.SONDA_FSA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-backend.txt

      - name: Conferir segredo do banco
        run: |
          if [ -z "$SONDA_DATABASE_URL" ]; then
            echo "::error::Defina o segredo SONDA_DATABASE_URL (connection string POOLED do Neon)."
            exit 1
          fi

      - name: Baixar base FSA (conferida pelo pin sha256)
        run: python baixar_fsa.py

      - name: Seed (só se o banco estiver vazio)
        run: |
          python - <<'PY'
          from sonda.db import connect, init_schema
          init_schema()
          with connect() as c:
              n = c.execute("SELECT COUNT(*) AS n FROM cruzamento").fetchone()["n"]
          if n:
              print(f"::notice::banco já tem {n} cruzamento(s); seed não executado.")
              raise SystemExit(0)
          import seed
          seed.main()
          PY
