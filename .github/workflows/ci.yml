name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sonda
          POSTGRES_PASSWORD: sonda
          POSTGRES_DB: sonda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SONDA_DATABASE_URL: postgresql://sonda:sonda@localhost:5432/sonda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Baixar base FSA (hospedada fora do git; conferida pelo pin sha256)
        if: ${{ vars.SONDA_FSA_URL != '' }}
        env:
          SONDA_FSA_URL: ${{ vars.SONDA_FSA_URL }}
          SONDA_FSA_TOKEN: ${{ secrets.SONDA_FSA_TOKEN }}
        run: python baixar_fsa.py
      - name: Testes do motor (DuckDB, sem banco)
        run: pytest tests/ -q
      - name: Seed fim-a-fim (ingestão + cruzamento + série temporal)
        run: python seed.py

  frontend:
    name: frontend · vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
